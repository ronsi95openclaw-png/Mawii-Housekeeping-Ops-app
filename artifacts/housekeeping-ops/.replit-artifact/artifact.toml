kind = "web"
previewPath = "/"
title = "Housekeeping Ops"
description = "A responsive operations platform for housekeeping teams to coordinate jobs, visualize schedules, send employee and client reminders, manage checklists, and document completed work with photos."
version = "1.0.0"
id = "artifacts/housekeeping-ops"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 21201

[services.development]
run = "pnpm --filter @workspace/housekeeping-ops run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/housekeeping-ops", "run", "build" ]
serve = "static"
publicDir = "artifacts/housekeeping-ops/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "21201"
BASE_PATH = "/"
