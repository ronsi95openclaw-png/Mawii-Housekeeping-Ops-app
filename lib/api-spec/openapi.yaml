openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: dashboard
    description: Operations overview
  - name: jobs
    description: Cleaning jobs
  - name: team
    description: Team members
  - name: activity
    description: Recent operations activity
  - name: storage
    description: Protected object storage uploads
  - name: integrations
    description: External job intake
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [dashboard]
      summary: Get operations dashboard summary
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"
  /dashboard/daily-summary:
    post:
      operationId: triggerDailySummary
      tags: [dashboard]
      summary: Trigger the daily internal operations summary
      responses:
        "201":
          description: Summary notification result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailySummaryResult"
  /activity:
    get:
      operationId: getActivity
      tags: [activity]
      summary: Get recent operations activity
      responses:
        "200":
          description: Recent activity
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Activity"
  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: List cleaning jobs
      parameters:
        - name: startDate
          in: query
          schema:
            type: string
            format: date
        - name: endDate
          in: query
          schema:
            type: string
            format: date
        - name: status
          in: query
          schema:
            type: string
            enum: [scheduled, in_progress, completed, attention]
      responses:
        "200":
          description: Cleaning jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Job"
    post:
      operationId: createJob
      tags: [jobs]
      summary: Create a cleaning job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Created job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get a cleaning job
      parameters:
        - $ref: "#/components/parameters/Id"
      responses:
        "200":
          description: Cleaning job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "404":
          description: Job not found
    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update a cleaning job
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{id}/checklist:
    patch:
      operationId: updateJobChecklist
      tags: [jobs]
      summary: Update checklist completion for a job
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChecklistUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
  /jobs/{jobId}/assignments:
    post:
      operationId: assignEmployeeToJob
      tags: [field-ops]
      parameters:
        - $ref: "#/components/parameters/JobId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobAssignmentInput"
      responses:
        "201":
          description: Job assignment
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobAssignment"
  /jobs/{id}/messages:
    post:
      operationId: sendJobMessage
      tags: [jobs]
      summary: Send a job message
      parameters:
        - $ref: "#/components/parameters/Id"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MessageInput"
      responses:
        "201":
          description: Sent message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Message"
  /team:
    get:
      operationId: listTeam
      tags: [team]
      summary: List team members
      responses:
        "200":
          description: Team members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TeamMember"
    post:
      operationId: createTeamMember
      tags: [team]
      summary: Add a team member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TeamMemberInput"
      responses:
        "201":
          description: Created team member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TeamMember"
  /integrations/elevate/gmail-sync:
    post:
      operationId: syncElevateMailbox
      tags: [integrations]
      summary: Read the ElevateOS schedule emails and import any new appointments
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                type: object
                required: [scanned, created, alreadyImported, problems]
                properties:
                  scanned: { type: integer }
                  created: { type: integer }
                  alreadyImported: { type: integer }
                  problems: { type: array, items: { type: string } }
  /integrations/elevate/jobs:
    post:
      operationId: importElevateJob
      tags: [integrations]
      summary: Receive an Elevate OS appointment webhook
      parameters:
        - name: X-Mawii-Signature
          in: header
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ElevateJobInput"
      responses:
        "200":
          description: Existing appointment updated without creating a duplicate
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevateImportResult"
        "201":
          description: Appointment imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevateImportResult"
        "400":
          description: Invalid appointment payload
        "401":
          description: Invalid webhook signature
        "422":
          description: Appointment could not be imported
  /integrations/elevate/status:
    get:
      operationId: getElevateImportStatus
      tags: [integrations]
      summary: Get Elevate OS import health and recent deliveries
      responses:
        "200":
          description: Elevate import status
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ElevateImportStatus"
  /storage/uploads/request-url:
    post:
      operationId: requestUploadUrl
      tags: [storage]
      summary: Request a protected direct-to-storage upload URL
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UploadInput"
      responses:
        "201":
          description: Upload URL
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUrl"
  /customers:
    get:
      operationId: listCustomers
      tags: [field-ops]
      responses:
        "200": { description: Customers, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Customer" } } } } }
    post:
      operationId: createCustomer
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } } }
  /customers/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateCustomer
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CustomerUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Customer" } } } } }
  /customers/{id}/addresses:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    get:
      operationId: listCustomerAddresses
      tags: [field-ops]
      responses: { "200": { description: Addresses, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Address" } } } } } }
    post:
      operationId: createCustomerAddress
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } } }
  /customers/{customerId}/addresses/{id}:
    parameters:
      - name: customerId
        in: path
        required: true
        schema: { type: integer }
      - $ref: "#/components/parameters/Id"
    patch:
      operationId: updateCustomerAddress
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/AddressUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/Address" } } } } }
  /service-plans:
    get:
      operationId: listServicePlans
      tags: [field-ops]
      responses: { "200": { description: Plans, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ServicePlan" } } } } } }
    post:
      operationId: createServicePlan
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlanInput" } } } }
      responses: { "201": { description: Created, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlan" } } } } }
  /service-plans/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateServicePlan
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlanUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlan" } } } } }
  /service-plans/{id}/pause:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: pauseServicePlan
      tags: [field-ops]
      responses: { "200": { description: Paused, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlan" } } } } }
  /service-plans/{id}/resume:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: resumeServicePlan
      tags: [field-ops]
      responses: { "200": { description: Resumed, content: { application/json: { schema: { $ref: "#/components/schemas/ServicePlan" } } } } }
  /service-plans/{id}/generate:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: generateServiceOccurrences
      tags: [field-ops]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/GenerateOccurrencesInput" } } } }
      responses: { "201": { description: Occurrences, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ServiceOccurrence" } } } } } }
  /service-plans/{id}/occurrences:
    get:
      operationId: listServicePlanOccurrences
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Occurrences, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ServiceOccurrence" } } } } } }
  /occurrences/{id}/skip:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    post:
      operationId: skipOccurrence
      tags: [field-ops]
      requestBody: { content: { application/json: { schema: { $ref: "#/components/schemas/SkipOccurrenceInput" } } } }
      responses: { "200": { description: Skipped, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceOccurrence" } } } } }
  /occurrences/{id}:
    parameters: [{ $ref: "#/components/parameters/Id" }]
    patch:
      operationId: updateOccurrence
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/OccurrenceUpdate" } } } }
      responses: { "200": { description: Updated, content: { application/json: { schema: { $ref: "#/components/schemas/ServiceOccurrence" } } } } }
  /employees/me:
    get:
      operationId: getEmployeeMe
      tags: [field-ops]
      responses: { "200": { description: Employee, content: { application/json: { schema: { $ref: "#/components/schemas/Employee" } } } } }
  /employees/claim:
    post:
      operationId: claimEmployee
      tags: [field-ops]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmployeeClaimInput"
      responses:
        "200":
          description: Claimed employee
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Employee"
  /employees:
    get:
      operationId: listEmployees
      tags: [field-ops]
      parameters:
        - name: includeInactive
          in: query
          required: false
          schema: { type: string, enum: ["true"] }
          description: Include deactivated employees so they can be reviewed and restored.
      responses: { "200": { description: Employees, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Employee" } } } } } }
    post:
      operationId: createEmployee
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeInput" } } } }
      responses: { "201": { description: Employee, content: { application/json: { schema: { $ref: "#/components/schemas/Employee" } } } } }
  /employees/{id}:
    patch:
      operationId: updateEmployee
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/EmployeeUpdate" } } } }
      responses: { "200": { description: Employee, content: { application/json: { schema: { $ref: "#/components/schemas/Employee" } } } } }
  /jobs/assigned:
    get:
      operationId: listAssignedJobs
      tags: [field-ops]
      responses: { "200": { description: Assignments, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JobAssignment" } } } } } }
  /assignments/{id}/{decision}:
    post:
      operationId: respondToAssignment
      tags: [field-ops]
      parameters:
        - $ref: "#/components/parameters/Id"
        - { name: decision, in: path, required: true, schema: { type: string, enum: [accept, decline] } }
      responses: { "200": { description: Assignment, content: { application/json: { schema: { $ref: "#/components/schemas/JobAssignment" } } } } }
  /jobs/{jobId}/time/clock-in:
    post:
      operationId: clockInToJob
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses: { "201": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/{id}/clock-out:
    post:
      operationId: clockOutTimeEntry
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/{id}/break:
    post:
      operationId: addTimeBreak
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/BreakInput" } } } }
      responses: { "200": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/{id}/correction:
    post:
      operationId: requestTimeCorrection
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/TimeCorrectionInput" } } } }
      responses: { "200": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/{id}/approve:
    post:
      operationId: approveTimeCorrection
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/{id}/reject:
    post:
      operationId: rejectTimeCorrection
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/CorrectionRejection" } } } }
      responses: { "200": { description: Time entry, content: { application/json: { schema: { $ref: "#/components/schemas/TimeEntry" } } } } }
  /time-entries/active:
    get:
      operationId: getActiveTimeEntries
      tags: [field-ops]
      parameters: [{ name: jobId, in: query, schema: { type: integer } }]
      responses: { "200": { description: Active entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimeEntry" } } } } } }
  /time-entries:
    get:
      operationId: listTimeEntries
      tags: [field-ops]
      parameters: [{ name: status, in: query, schema: { type: string, enum: [pending] } }]
      responses: { "200": { description: Time entries, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/TimeEntry" } } } } } }
  /jobs/{jobId}/photos:
    parameters: [{ $ref: "#/components/parameters/JobId" }]
    get:
      operationId: listProofPhotos
      tags: [field-ops]
      responses: { "200": { description: Photos, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ProofPhoto" } } } } } }
    post:
      operationId: registerProofPhoto
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/ProofPhotoInput" } } } }
      responses: { "201": { description: Photo, content: { application/json: { schema: { $ref: "#/components/schemas/ProofPhoto" } } } } }
  /jobs/{jobId}/notes:
    get:
      operationId: listEmployeeJobNotes
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses: { "200": { description: Notes, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/JobNote" } } } } } }
    post:
      operationId: addEmployeeJobNote
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/JobNoteInput" } } } }
      responses: { "201": { description: Note, content: { application/json: { schema: { $ref: "#/components/schemas/JobNote" } } } } }
  /jobs/{jobId}/complete:
    post:
      operationId: completeAssignedJob
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses: { "200": { description: Completed job, content: { application/json: { schema: { $ref: "#/components/schemas/Job" } } } } }
  /jobs/{jobId}/incidents:
    post:
      operationId: createIncident
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentInput" } } } }
      responses: { "201": { description: Incident, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } } }
  /incidents/{id}:
    patch:
      operationId: reviewIncident
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/IncidentUpdate" } } } }
      responses: { "200": { description: Incident, content: { application/json: { schema: { $ref: "#/components/schemas/Incident" } } } } }
  /incidents:
    get:
      operationId: listIncidents
      tags: [field-ops]
      parameters: [{ name: status, in: query, schema: { type: string } }]
      responses: { "200": { description: Incidents, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Incident" } } } } } }
  /worker-rates:
    post:
      operationId: createWorkerRate
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerRateInput" } } } }
      responses: { "201": { description: Rate, content: { application/json: { schema: { $ref: "#/components/schemas/WorkerRate" } } } } }
  /payouts:
    get:
      operationId: listPayouts
      tags: [field-ops]
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date-time } }
        - { name: end, in: query, required: true, schema: { type: string, format: date-time } }
      responses: { "200": { description: Payouts, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/Payout" } } } } } }
  /activity/history:
    get:
      operationId: listActivityHistory
      tags: [activity]
      responses: { "200": { description: Activity, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/ActivityEvent" } } } } } }
  /jobs/{jobId}/messages:
    get:
      operationId: listJobMessages
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses: { "200": { description: Messages, content: { application/json: { schema: { type: array, items: { $ref: "#/components/schemas/MessageRecord" } } } } } }
    post:
      operationId: sendFieldJobMessage
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FieldMessageInput"
      responses:
        "201":
          description: Internal job message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageRecord"
  /jobs/{jobId}/reminders:
    get:
      operationId: listJobReminders
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      responses:
        "200":
          description: Internal reminders
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Reminder"
    post:
      operationId: createJobReminder
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/JobId" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReminderInput"
      responses:
        "201":
          description: Internal reminder
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reminder"
  /notifications:
    get:
      operationId: listNotifications
      tags: [field-ops]
      parameters:
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 30 }
      responses:
        "200":
          description: Notifications for the current employee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"
  /notifications/{id}/read:
    post:
      operationId: markNotificationRead
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses:
        "200":
          description: Read notification
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Notification"
  /notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      tags: [field-ops]
      responses:
        "204":
          description: Notifications marked read
  /pay-periods:
    get:
      operationId: listPayPeriods
      tags: [field-ops]
      responses: { "200": { description: Pay periods, content: { application/json: { schema: { type: array, items: { type: object } } } } } }
    post:
      operationId: createPayPeriod
      tags: [field-ops]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PayPeriodInput" } } } }
      responses: { "201": { description: Pay period, content: { application/json: { schema: { $ref: "#/components/schemas/PayPeriod" } } } } }
  /pay-periods/{id}/approve:
    post:
      operationId: approvePayPeriod
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Approved period, content: { application/json: { schema: { $ref: "#/components/schemas/PayPeriod" } } } } }
  /pay-periods/{id}/paid:
    post:
      operationId: markPayPeriodPaid
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      responses: { "200": { description: Paid period, content: { application/json: { schema: { $ref: "#/components/schemas/PayPeriod" } } } } }
  /pay-periods/{id}/adjustments:
    post:
      operationId: addPayoutAdjustment
      tags: [field-ops]
      parameters: [{ $ref: "#/components/parameters/Id" }]
      requestBody: { required: true, content: { application/json: { schema: { $ref: "#/components/schemas/PayoutAdjustment" } } } }
      responses: { "200": { description: Payout, content: { application/json: { schema: { type: object } } } } }
  /reports/owner:
    get:
      operationId: getOwnerReport
      tags: [field-ops]
      parameters:
        - { name: start, in: query, required: true, schema: { type: string, format: date } }
        - { name: end, in: query, required: true, schema: { type: string, format: date } }
      responses: { "200": { description: Owner report, content: { application/json: { schema: { $ref: "#/components/schemas/OwnerReport" } } } } }
components:
  parameters:
    Id:
      name: id
      in: path
      required: true
      schema:
        type: integer
    JobId:
      name: jobId
      in: path
      required: true
      schema: { type: integer }
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DashboardSummary:
      type: object
      required: [todayJobs, openJobs, completedThisWeek, attentionNeeded, pendingIncidents, pendingCorrections, unreadNotifications, operations, nextJob]
      properties:
        todayJobs:
          type: integer
        openJobs:
          type: integer
        completedThisWeek:
          type: integer
        attentionNeeded:
          type: integer
        pendingIncidents:
          type: integer
        pendingCorrections:
          type: integer
        unreadNotifications:
          type: integer
        operations:
          type: array
          items:
            allOf:
              - $ref: "#/components/schemas/Job"
              - type: object
                required: [pendingIncidents, pendingCorrections, notificationCount]
                properties:
                  pendingIncidents: { type: integer }
                  pendingCorrections: { type: integer }
                  notificationCount: { type: integer }
        nextJob:
          anyOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
    DailySummaryResult:
      type: object
      required: [summaryDate, notifiedCount, summary]
      properties:
        summaryDate: { type: string, format: date }
        notifiedCount: { type: integer }
        summary: { type: string }
    Activity:
      type: object
      required: [id, type, title, detail, createdAt]
      properties:
        id:
          type: integer
        type:
          type: string
          enum: [job, message, checklist, photo, team]
        title:
          type: string
        detail:
          type: string
        createdAt:
          type: string
          format: date-time
        externalSource:
          type: ["string", "null"]
        externalId:
          type: ["string", "null"]
        jobId:
          type: ["integer", "null"]
    Job:
      type: object
      required: [id, clientName, address, scheduledDate, startTime, endTime, status, serviceType, team, checklist]
      properties:
        id:
          type: integer
        clientName:
          type: string
        address:
          type: string
        scheduledDate:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, attention]
        serviceType:
          type: string
        serviceVariant:
          type: ["string", "null"]
        addOns:
          type: array
          items:
            type: string
        durationMinutes:
          type: ["integer", "null"]
        frequency:
          type: ["string", "null"]
        notes:
          type: ["string", "null"]
        accessInstructions:
          type: ["string", "null"]
        team:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"
        assignedEmployees:
          type: array
          items:
            $ref: "#/components/schemas/Employee"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/JobAssignment"
        checklist:
          type: array
          items:
            $ref: "#/components/schemas/ChecklistItem"
        photos:
          type: array
          items:
            $ref: "#/components/schemas/Photo"
        clientPhone:
          type: ["string", "null"]
        createdAt:
          type: string
          format: date-time
    JobInput:
      type: object
      required: [clientName, address, scheduledDate, startTime, endTime, serviceType]
      properties:
        clientName:
          type: string
          minLength: 1
        address:
          type: string
          minLength: 1
        scheduledDate:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        serviceType:
          type: string
        serviceVariant:
          type: string
        addOns:
          type: array
          items:
            type: string
        durationMinutes:
          type: integer
          minimum: 0
        frequency:
          type: string
        notes:
          type: string
        clientPhone:
          type: string
        teamMemberIds:
          type: array
          items:
            type: integer
        employeeIds:
          type: array
          items:
            type: integer
    JobUpdate:
      type: object
      properties:
        scheduledDate:
          type: string
          format: date
        startTime:
          type: string
        endTime:
          type: string
        status:
          type: string
          enum: [scheduled, in_progress, completed, attention]
        # Correcting a job's own address, needed when an import lands an incomplete one
        # and there is no customer record behind the job to fix instead.
        address:
          type: string
          minLength: 1
        notes:
          type: string
        serviceVariant:
          type: string
        addOns:
          type: array
          items:
            type: string
        durationMinutes:
          type: integer
          minimum: 0
        frequency:
          type: string
        teamMemberIds:
          type: array
          items:
            type: integer
        employeeIds:
          type: array
          items:
            type: integer
    ChecklistItem:
      type: object
      required: [id, label, completed]
      properties:
        id:
          type: integer
        label:
          type: string
        completed:
          type: boolean
    ChecklistUpdate:
      type: object
      required: [itemId, completed]
      properties:
        itemId:
          type: integer
        completed:
          type: boolean
    Photo:
      type: object
      required: [id, url, label, createdAt]
      properties:
        id:
          type: integer
        url:
          type: string
          format: uri
        label:
          type: string
        createdAt:
          type: string
          format: date-time
    TeamMember:
      type: object
      required: [id, name, role, phone, status]
      properties:
        id:
          type: integer
        name:
          type: string
        role:
          type: string
        phone:
          type: string
        status:
          type: string
          enum: [available, assigned, off]
        initials:
          type: string
    TeamMemberInput:
      type: object
      required: [name, role, phone]
      properties:
        name:
          type: string
        role:
          type: string
        phone:
          type: string
    MessageInput:
      type: object
      required: [recipient, body]
      properties:
        recipient:
          type: string
          enum: [client, team]
        body:
          type: string
          minLength: 1
        channel:
          type: string
          enum: [sms, whatsapp]
          default: sms
        audience:
          type: string
          enum: [customer, employee]
          default: customer
        recipientPhone:
          type: string
        recipientName:
          type: string
        metadata:
          type: object
    Message:
      type: object
      required: [id, recipient, body, channel, audience, status, createdAt]
      properties:
        id:
          type: integer
        recipient:
          type: string
          enum: [client, team]
        body:
          type: string
        channel:
          type: string
          enum: [sms, whatsapp]
        audience:
          type: string
          enum: [customer, employee]
        recipientPhone:
          type: ["string", "null"]
        recipientName:
          type: ["string", "null"]
        providerMessageId:
          type: ["string", "null"]
        status:
          type: string
          enum: [queued, sent, failed]
        createdAt:
          type: string
          format: date-time
        sentAt:
          type: ["string", "null"]
          format: date-time
        deliveredAt:
          type: ["string", "null"]
          format: date-time
        failedAt:
          type: ["string", "null"]
          format: date-time
        failureReason:
          type: ["string", "null"]
        metadata:
          type: object
        actorClerkUserId:
          type: ["string", "null"]
    ElevateJobInput:
      type: object
      required: [appointmentId, clientName, address, appointment, dateTime]
      properties:
        appointmentId:
          type: string
          minLength: 1
        clientName:
          type: string
          minLength: 1
        clientPhone:
          type: string
        address:
          type: string
          minLength: 1
        appointment:
          type: string
          minLength: 1
        variant:
          type: string
        addOns:
          type: array
          items:
            type: string
        durationMinutes:
          type: integer
          minimum: 1
        frequency:
          type: string
        dateTime:
          type: string
          format: date-time
        endDateTime:
          type: string
          format: date-time
        status:
          type: string
          enum: [scheduled, confirmed, in_progress, completed, cancelled, attention]
        assignedWorker:
          type: string
        notes:
          type: string
    ElevateImportResult:
      type: object
      required: [success, duplicate, message]
      properties:
        success:
          type: boolean
        duplicate:
          type: boolean
        message:
          type: string
        job:
          anyOf:
            - $ref: "#/components/schemas/Job"
            - type: "null"
        warnings:
          type: array
          items:
            type: string
    ElevateImportEvent:
      type: object
      required: [id, success, duplicate, message, receivedAt]
      properties:
        id:
          type: integer
        externalId:
          type: ["string", "null"]
        success:
          type: boolean
        duplicate:
          type: boolean
        message:
          type: string
        jobId:
          type: ["integer", "null"]
        receivedAt:
          type: string
          format: date-time
    ElevateImportStatus:
      type: object
      required: [method, configured, totalReceived, failedCount, recentEvents]
      properties:
        method:
          type: string
          enum: [gohighlevel_webhook]
        configured:
          type: boolean
        totalReceived:
          type: integer
        failedCount:
          type: integer
        lastReceivedAt:
          type: ["string", "null"]
          format: date-time
        recentEvents:
          type: array
          items:
            $ref: "#/components/schemas/ElevateImportEvent"
    UploadInput:
      type: object
      required: [name, size, contentType]
      properties:
        name: { type: string, minLength: 1 }
        size: { type: integer, minimum: 1 }
        contentType: { type: string, minLength: 1 }
    UploadUrl:
      type: object
      required: [uploadURL, objectPath, metadata]
      properties:
        uploadURL: { type: string, format: uri }
        objectPath: { type: string }
        metadata:
          type: object
          required: [name, size, contentType]
          properties:
            name: { type: string }
            size: { type: integer }
            contentType: { type: string }
    Customer:
      type: object
      required: [id, name]
      properties:
        id: { type: integer }
        name: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    CustomerInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        phone: { type: string }
        email: { type: string }
        notes: { type: string }
    CustomerUpdate:
      type: object
      properties:
        name: { type: string }
        phone: { type: ["string", "null"] }
        email: { type: ["string", "null"] }
        notes: { type: ["string", "null"] }
    Address:
      type: object
      required: [id, customerId, line1, city, state, postalCode]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        label: { type: string }
        line1: { type: string }
        line2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        accessNotes: { type: ["string", "null"] }
    AddressInput:
      type: object
      required: [line1, city, state, postalCode]
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: string }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        accessNotes: { type: string }
    AddressUpdate:
      type: object
      properties:
        label: { type: string }
        line1: { type: string }
        line2: { type: ["string", "null"] }
        city: { type: string }
        state: { type: string }
        postalCode: { type: string }
        accessNotes: { type: ["string", "null"] }
    ServicePlan:
      type: object
      required: [id, customerId, addressId, serviceType, frequency, nextOccurrence]
      properties:
        id: { type: integer }
        customerId: { type: integer }
        addressId: { type: integer }
        serviceType: { type: string }
        frequency: { type: string, enum: [weekly, biweekly, monthly, every_n_weeks] }
        intervalWeeks: { type: ["integer", "null"] }
        nextOccurrence: { type: string, format: date }
        pausedAt: { type: ["string", "null"], format: date-time }
    ServicePlanInput:
      type: object
      required: [customerId, addressId, serviceType, frequency, nextOccurrence]
      properties:
        customerId: { type: integer }
        addressId: { type: integer }
        serviceType: { type: string }
        frequency: { type: string }
        intervalWeeks: { type: integer }
        nextOccurrence: { type: string, format: date }
    ServicePlanUpdate:
      type: object
      properties:
        frequency: { type: string }
        intervalWeeks: { type: integer }
        nextOccurrence: { type: string, format: date }
        serviceType: { type: string }
    GenerateOccurrencesInput:
      type: object
      properties: { count: { type: integer, minimum: 1, default: 12 } }
    ServiceOccurrence:
      type: object
      required: [id, planId, occurrenceDate, status]
      properties:
        id: { type: integer }
        planId: { type: integer }
        jobId: { type: ["integer", "null"] }
        occurrenceDate: { type: string, format: date }
        status: { type: string }
        skippedReason: { type: ["string", "null"] }
    SkipOccurrenceInput:
      type: object
      properties: { reason: { type: string } }
    OccurrenceUpdate:
      type: object
      properties:
        occurrenceDate: { type: string, format: date }
        status: { type: string }
        jobId: { type: integer }
    Employee:
      type: object
      required: [id, clerkUserId, name, role]
      properties:
        id: { type: integer }
        clerkUserId: { type: string }
        name: { type: string }
        role: { type: string, enum: [owner, manager, cleaner] }
        phone: { type: ["string", "null"] }
        active: { type: string }
        bindingToken: { type: ["string", "null"] }
    EmployeeInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        clerkUserId: { type: string }
        role: { type: string, enum: [owner, manager, cleaner] }
        phone: { type: string }
        active: { type: string }
    EmployeeClaimInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1 }
    EmployeeUpdate:
      type: object
      properties:
        name: { type: string }
        clerkUserId: { type: string }
        role: { type: string, enum: [owner, manager, cleaner] }
        phone: { type: string }
        active: { type: string }
    JobAssignment:
      type: object
      required: [id, jobId, employeeId, status]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        employeeId: { type: integer }
        status: { type: string }
        # Summary of the job travels with the assignment so a phone renders the list
        # in one request instead of one per row.
        job:
          type: object
          required: [id, clientName, address, serviceType, scheduledDate, startTime, endTime, status]
          properties:
            id: { type: integer }
            clientName: { type: string }
            address: { type: string }
            serviceType: { type: string }
            scheduledDate: { type: string, format: date }
            startTime: { type: string }
            endTime: { type: string }
            status: { type: string }
    JobAssignmentInput:
      type: object
      required: [employeeId]
      properties:
        employeeId: { type: integer }
    TimeEntry:
      type: object
      required: [id, jobId, employeeId, clockIn]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        employeeId: { type: integer }
        clockIn: { type: string, format: date-time }
        clockOut: { type: ["string", "null"], format: date-time }
        breaksMinutes: { type: integer }
        correctionMinutes: { type: integer }
        correctionStatus: { type: string }
    BreakInput:
      type: object
      required: [minutes]
      properties: { minutes: { type: integer, minimum: 0 } }
    TimeCorrectionInput:
      type: object
      required: [minutes, reason]
      properties: { minutes: { type: integer }, reason: { type: string } }
    CorrectionRejection:
      type: object
      required: [reason]
      properties: { reason: { type: string } }
    ProofPhoto:
      type: object
      required: [id, jobId, kind, objectPath, contentType]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        kind: { type: string, enum: [before, after] }
        objectPath: { type: string }
        contentType: { type: string }
        byteSize: { type: ["integer", "null"] }
    ProofPhotoInput:
      type: object
      required: [kind, objectPath]
      properties:
        kind: { type: string, enum: [before, after] }
        objectPath: { type: string }
        contentType: { type: string }
        byteSize: { type: integer }
    JobNote:
      type: object
      required: [id, jobId, employeeId, body, createdAt]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        employeeId: { type: integer }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    JobNoteInput:
      type: object
      required: [body]
      properties: { body: { type: string, minLength: 1 } }
    Incident:
      type: object
      required: [id, jobId, type, severity, description, status]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        type: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        description: { type: string }
        evidencePhotoIds:
          type: array
          items: { type: integer }
        reporterEmployeeId: { type: ["integer", "null"] }
        status: { type: string, enum: [open, in_review, resolved, reclean] }
        resolution: { type: ["string", "null"] }
        reviewedBy: { type: ["integer", "null"] }
        reviewedAt: { type: ["string", "null"], format: date-time }
        history:
          type: array
          items: { type: object }
    IncidentInput:
      type: object
      required: [description]
      properties:
        type: { type: string }
        severity: { type: string, enum: [low, medium, high, critical] }
        description: { type: string }
        evidencePhotoIds:
          type: array
          items: { type: integer }
    IncidentUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in_review, resolved, reclean] }
        resolution: { type: string }
        note: { type: string }
    WorkerRate:
      type: object
      required: [id, employeeId, hourlyRate, effectiveFrom]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        hourlyRate: { type: string }
        effectiveFrom: { type: string, format: date }
    WorkerRateInput:
      type: object
      required: [employeeId, hourlyRate, effectiveFrom]
      properties:
        employeeId: { type: integer }
        hourlyRate: { type: string }
        effectiveFrom: { type: string, format: date }
    Payout:
      type: object
      required: [id, employeeId, approvedMinutes, approvedHours]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        approvedMinutes: { type: integer }
        approvedHours: { type: number }
        hourlyRate: { type: ["string", "null"] }
        amount: { type: ["number", "null"] }
    ActivityEvent:
      type: object
      required: [id, type, title, createdAt]
      properties:
        id: { type: integer }
        type: { type: string }
        title: { type: string }
        detail: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    MessageRecord:
      type: object
      required: [id, recipient, body, channel, audience, status, provider, createdAt]
      properties:
        id: { type: integer }
        recipient: { type: string }
        body: { type: string }
        channel: { type: string, enum: [internal, sms, whatsapp] }
        audience: { type: string, enum: [customer, employee] }
        status: { type: string }
        provider: { type: string }
        recipientPhone: { type: ["string", "null"] }
        recipientName: { type: ["string", "null"] }
        providerMessageId: { type: ["string", "null"] }
        sentAt: { type: ["string", "null"], format: date-time }
        deliveredAt: { type: ["string", "null"], format: date-time }
        failedAt: { type: ["string", "null"], format: date-time }
        failureReason: { type: ["string", "null"] }
        metadata: { type: object }
        actorClerkUserId: { type: ["string", "null"] }
        createdAt: { type: string, format: date-time }
    FieldMessageInput:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1 }
        recipient: { type: string }
        audience: { type: string, enum: [employee] }
    Reminder:
      type: object
      required: [id, jobId, title, body, createdAt]
      properties:
        id: { type: integer }
        jobId: { type: integer }
        createdByEmployeeId: { type: ["integer", "null"] }
        title: { type: string }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ReminderInput:
      type: object
      required: [title, body]
      properties:
        title: { type: string, minLength: 1 }
        body: { type: string, minLength: 1 }
    Notification:
      type: object
      required: [id, employeeId, kind, title, body, readAt, createdAt]
      properties:
        id: { type: integer }
        employeeId: { type: integer }
        jobId: { type: ["integer", "null"] }
        kind: { type: string }
        title: { type: string }
        body: { type: string }
        readAt: { type: ["string", "null"], format: date-time }
        createdAt: { type: string, format: date-time }
    PayPeriod:
      type: object
      required: [id, startsOn, endsOn, status]
      properties:
        id: { type: integer }
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
        status: { type: string, enum: [draft, approved, paid] }
        approvedBy: { type: ["integer", "null"] }
        approvedAt: { type: ["string", "null"], format: date-time }
        paidBy: { type: ["integer", "null"] }
        paidAt: { type: ["string", "null"], format: date-time }
    PayPeriodInput:
      type: object
      required: [startsOn, endsOn]
      properties:
        startsOn: { type: string, format: date }
        endsOn: { type: string, format: date }
    PayoutAdjustment:
      type: object
      required: [employeeId, amount, reason]
      properties:
        employeeId: { type: integer }
        amount: { type: string }
        reason: { type: string }
        createdAt: { type: string, format: date-time }
    OwnerReport:
      type: object
      required: [dateRange, jobs, employees, payouts, recurringServices, activeRecurringServices, pausedRecurringServices, incidents, customerHistoryCount]
      properties:
        dateRange:
          type: object
          properties:
            start: { type: string, format: date }
            end: { type: string, format: date }
        jobs:
          type: object
          properties:
            volume: { type: integer }
            completed: { type: integer }
            completedThisWeek: { type: integer }
        employees:
          type: array
          items:
            type: object
            properties:
              id: { type: integer }
              name: { type: string }
              role: { type: string }
              approvedMinutes: { type: integer }
              approvedHours: { type: number }
              amount: { type: number }
        payouts:
          type: object
          required: [approvedMinutes, approvedHours, baseAmount, adjustmentAmount, finalAmount, amount]
          properties:
            approvedMinutes: { type: integer }
            approvedHours: { type: number }
            baseAmount: { type: number }
            adjustmentAmount: { type: number }
            finalAmount: { type: number }
            amount: { type: number }
        recurringServices: { type: integer }
        activeRecurringServices: { type: integer }
        pausedRecurringServices: { type: integer }
        incidents:
          type: object
          additionalProperties: { type: integer }
        customerHistoryCount: { type: integer }

